name: brainy
description: Brain training app for kids with Schulte tables
version: 1.1.0+15

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.8

  # Subscriptions (RevenueCat — commented out, see YooKassa below)
  # purchases_flutter: ^9.14.0
  # purchases_ui_flutter: ^9.14.0

  # YooKassa payments (Russian market)
  cloud_functions: ^6.0.7
  flutter_secure_storage: ^9.2.4
  device_info_plus: ^11.0.0

  # Game Center / Google Play Games
  games_services: ^5.0.0

  # Animations
  confetti: ^0.7.0

  # Charts
  fl_chart: ^0.66.0

  # Screenshots & sharing
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5

  # Audio
  audioplayers: ^6.6.0

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  permission_handler: ^12.0.1

  # URL launcher
  url_launcher: ^6.2.5

  # App info
  package_info_plus: ^8.0.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  collection: ^1.19.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  # hive_generator incompatible with riverpod_generator (source_gen conflict)
  # Hive adapters are written manually

  # App icon & splash
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#0D0D1A"
  image: assets/splash/splash_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/characters/
    - assets/animations/
    - assets/sounds/
    - assets/badges/
    - assets/leagues/
    - assets/icon/
    - assets/splash/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
