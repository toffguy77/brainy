name: brainy
description: Brain training app for kids with Schulte tables
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_analytics: ^11.5.1
  firebase_crashlytics: ^4.3.3

  # Subscriptions
  purchases_flutter: ^8.4.1

  # Animations
  lottie: ^3.3.1

  # Ads
  google_mobile_ads: ^5.3.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  collection: ^1.19.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  # hive_generator: added when Hive adapters are needed

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/characters/
    - assets/animations/
    - assets/sounds/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
